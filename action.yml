name: Wingbox Pull Request Check
description: Comments on a pull request with the modules that depend on the changed files but were not changed, as a list and a diagram.
author: Aileron Technologies
branding:
  icon: git-pull-request
  color: blue

inputs:
  version:
    description: The wingbox release installed from PyPI, with the parser of every language.
    default: "0.14.0"
  hops:
    description: How far dependents are followed from each changed file.
    default: "2"
  fail-on:
    description: "none, violations (a layer, capability or pattern violation introduced by the pull request), not-checked (a part that could not be checked) or strict (everything but a PASS or NOT_APPLICABLE result)."
    default: none
  comment:
    description: Write the report as one comment on the pull request, updated on each push.
    default: "true"
  upload-map:
    description: Upload the interactive map Wingbox builds (.wingbox/map.html) as the workflow artifact wingbox-map; it is kept as long as the repository keeps artifacts.
    default: "false"
  paths:
    description: "Glob patterns of the changed files to report on, one per line; !pattern leaves files out. Empty: all."
    default: ""
  python-version:
    description: The Python used to run wingbox (3.11 or newer).
    default: "3.12"
  base:
    description: Base commit; default the base of the pull request.
    default: ""
  head:
    description: Head commit; default the head of the pull request.
    default: ""
  working-directory:
    description: The repository checkout.
    default: "."
  test-results:
    description: "Glob patterns of the JUnit XML reports the test step of this job wrote, one per line (** crosses folders). The report then says for each test that uses what changed which cases these reports hold of it and how each ended. The check itself never runs a test."
    default: ""
  require-tests:
    description: "true: fail the job unless every test that uses what changed, and every test the manifest requires for the change, is passed in the test results (every case recorded for it passed). strict: as true, and fail a change of source code for which no test was found. It does not change the result of the boundary check."
    default: "false"
  test-step-outcome:
    description: "How the test step of the job ended: success, failure, cancelled or skipped (give it steps.<id>.outcome of a test step with continue-on-error). Recorded in the evidence record; after failure the test evidence is failed whatever the test results hold."
    default: ""
  test-command:
    description: "The command of the test step that wrote the test results. Recorded verbatim in the evidence record; not run."
    default: ""
  require-test-provenance:
    description: "Refuse a test report without a matching sidecar (<report>.run.json with commit, run-id, attempt, command and sha256)."
    default: "false"
  required-tests:
    description: "Path of the manifest of required tests, from the root of the repository; empty: .wingbox/required-tests.yaml when the repository has it. The manifest of the base commit counts."
    default: ""
  github-token:
    description: Token for the comment (needs pull-requests write).
    default: ${{ github.token }}

outputs:
  report:
    description: Path of the Markdown report (the job summary).
    value: ${{ steps.check.outputs.report }}
  map:
    description: Path of the copy of the interactive map on the runner; empty unless upload-map is true.
    value: ${{ steps.check.outputs.map }}
  untouched-dependents:
    description: Number of dependent modules the pull request does not change.
    value: ${{ steps.check.outputs.untouched-dependents }}
  introduced-findings:
    description: Number of boundary findings the pull request introduces.
    value: ${{ steps.check.outputs.introduced-findings }}
  not-checked-parts:
    description: Number of parts wingbox boundaries could not check.
    value: ${{ steps.check.outputs.not-checked-parts }}
  plan:
    description: Path of the review plan (S-expression lines) for a reviewing agent.
    value: ${{ steps.check.outputs.plan }}
  evidence:
    description: Path of the evidence record of the run (wingbox-evidence.json, shape in schema/wingbox-evidence-2.schema.json). Written also when the check did not run.
    value: ${{ steps.check.outputs.evidence || steps.did-not-run.outputs.evidence }}
  result:
    description: "Result of the boundary check: PASS, FAIL, UNKNOWN or NOT_APPLICABLE. A part that was not checked or a tool error is UNKNOWN, never PASS."
    value: ${{ steps.check.outputs.result || steps.did-not-run.outputs.result }}
  execution:
    description: "ok, or error when a wingbox command ended abnormally."
    value: ${{ steps.check.outputs.execution || steps.did-not-run.outputs.execution }}
  reasons:
    description: The reasons of the result, separated by semicolons; empty for PASS.
    value: ${{ steps.check.outputs.reasons || steps.did-not-run.outputs.reasons }}
  tests-to-run:
    description: Number of tests that use what the pull request changes.
    value: ${{ steps.check.outputs.tests-to-run }}
  tests-passed:
    description: Number of those tests whose every recorded case passed in the test results; empty without test results.
    value: ${{ steps.check.outputs.tests-passed }}
  tests-failed:
    description: Number of those tests with a failed case in the test results; empty without test results.
    value: ${{ steps.check.outputs.tests-failed }}
  tests-without-record:
    description: Number of those tests that were skipped, in whole or in part, or are not in the test results; empty without test results.
    value: ${{ steps.check.outputs.tests-without-record }}
  tests-evidence:
    description: "The test evidence in one word: none (no test results), none-found (no test uses what changed and none is required), complete, incomplete or failed."
    value: ${{ steps.check.outputs.tests-evidence }}
  tests-required:
    description: Number of tests the manifest of required tests names for this change.
    value: ${{ steps.check.outputs.tests-required }}
  test-reports-refused:
    description: Number of test reports that were refused and do not count as evidence (tracked by git, older than the run, of another commit, or without a matching sidecar); empty without test results.
    value: ${{ steps.check.outputs.test-reports-refused }}
  tests-required-passed:
    description: Number of those required tests that are passed in the test results; empty without test results.
    value: ${{ steps.check.outputs.tests-required-passed }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      id: python
      with:
        python-version: ${{ inputs.python-version }}
        update-environment: false
    - name: Install wingbox
      shell: bash
      run: '"$WINGBOX_PYTHON" -P -m pip install --disable-pip-version-check --quiet "wingbox[all]==$WINGBOX_VERSION"'
      env:
        WINGBOX_PYTHON: ${{ steps.python.outputs.python-path }}
        WINGBOX_VERSION: ${{ inputs.version }}
    - name: Check the pull request
      id: check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: '"$WINGBOX_PYTHON" "$GITHUB_ACTION_PATH/wingbox_pr.py"'
      env:
        WINGBOX_PYTHON: ${{ steps.python.outputs.python-path }}
        WINGBOX_VERSION: ${{ inputs.version }}
        WINGBOX_HOPS: ${{ inputs.hops }}
        WINGBOX_FAIL_ON: ${{ inputs.fail-on }}
        WINGBOX_COMMENT: ${{ inputs.comment }}
        WINGBOX_UPLOAD_MAP: ${{ inputs.upload-map }}
        WINGBOX_PATHS: ${{ inputs.paths }}
        WINGBOX_BASE: ${{ inputs.base }}
        WINGBOX_HEAD: ${{ inputs.head }}
        WINGBOX_TEST_RESULTS: ${{ inputs.test-results }}
        WINGBOX_REQUIRE_TESTS: ${{ inputs.require-tests }}
        WINGBOX_REQUIRED_TESTS: ${{ inputs.required-tests }}
        WINGBOX_TEST_COMMAND: ${{ inputs.test-command }}
        WINGBOX_REQUIRE_TEST_PROVENANCE: ${{ inputs.require-test-provenance }}
        WINGBOX_TEST_STEP_OUTCOME: ${{ inputs.test-step-outcome }}
        WINGBOX_TOKEN: ${{ inputs.github-token }}
    - name: Upload the map
      if: ${{ !cancelled() && inputs.upload-map == 'true' && steps.check.outputs.map != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: wingbox-map
        path: ${{ steps.check.outputs.map }}
        if-no-files-found: warn
    # A record also when the check did not run (the install failed, or the check ended before it wrote one):
    # a job that hands records over then always has a document. By the Python of the runner when the setup failed.
    - name: Record that the check did not run
      id: did-not-run
      if: ${{ always() && steps.check.outputs.evidence == '' }}
      shell: bash
      run: |
        python_path="$WINGBOX_PYTHON"
        if [ -z "$python_path" ]; then python_path="$(command -v python3 || command -v python)"; fi
        "$python_path" -P "$GITHUB_ACTION_PATH/wingbox_pr.py" --did-not-run
      env:
        WINGBOX_PYTHON: ${{ steps.python.outputs.python-path }}
        WINGBOX_VERSION: ${{ inputs.version }}
        WINGBOX_BASE: ${{ inputs.base }}
        WINGBOX_HEAD: ${{ inputs.head }}
        WINGBOX_TEST_STEP_OUTCOME: ${{ inputs.test-step-outcome }}
        WINGBOX_TEST_COMMAND: ${{ inputs.test-command }}
