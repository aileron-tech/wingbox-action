# Wingbox pull request check for GitLab CI, for runners with the shell executor.
#
# Add to .gitlab-ci.yml:
#
#   include:
#     - remote: "https://raw.githubusercontent.com/aileron-tech/wingbox-action/v1/gitlab/wingbox-shell.gitlab-ci.yml"
#
# A shell runner runs the job's commands on its own machine, with whatever Python that machine has.
# This job therefore runs the check in a container (Docker must be usable by the runner's user):
# the checkout is mounted read-only, the container works on its own clone of it, and the only folder
# it writes on the runner is wingbox-out/, as the runner's user. Nothing is installed on the runner.
#
# The job checks every merge request and every push to the default branch. The report is in the job
# log and in the artifact folder wingbox-out/. To get it as one note on the merge request, add a
# masked CI/CD variable WINGBOX_GITLAB_TOKEN with a project access token (scope: api).
# Without a language model; no code leaves the runner.

wingbox:
  stage: test
  variables:
    GIT_DEPTH: "0"                    # the whole history: the base commit is checked out next to the head
    WINGBOX_VERSION: "0.14.0"         # the wingbox release from PyPI
    WINGBOX_ACTION_REF: "v1"          # the tag, branch or commit of aileron-tech/wingbox-action the scripts come from
    WINGBOX_IMAGE: "python:3.12"      # the image the check runs in (Python 3.11 or newer, with git)
    WINGBOX_HOPS: "2"
    WINGBOX_FAIL_ON: "none"           # none, violations, not-checked, strict or existing
    WINGBOX_TEST_SCRIPT: ""           # the command that runs your tests on the runner and writes JUnit XML (see the README)
    WINGBOX_POLICY_CHANGE: ""         # fail or report: a change of the baseline, the rules or this pipeline file; empty: fail with strict
    WINGBOX_PACKAGE: "false"          # true: also write wingbox-out/wingbox-package.zip, the evidence package of the run (see the README)
    WINGBOX_LEDGER: ""                # a ledger file in wingbox-out/, the folder the container may write: the run adds its line at the end
  script:
    - mkdir -p wingbox-out
    # The tests first, with their status kept: the check runs whatever they say, learns how they ended,
    # and the job ends with the tests' status.
    - tests_status=0
    - if [ -n "$WINGBOX_TEST_SCRIPT" ]; then sh -c "$WINGBOX_TEST_SCRIPT" || tests_status=$?; fi
    - if [ -n "$WINGBOX_TEST_SCRIPT" ]; then export WINGBOX_TEST_COMMAND="$WINGBOX_TEST_SCRIPT" WINGBOX_TEST_STEP_OUTCOME=success; fi
    - if [ "$tests_status" -ne 0 ]; then export WINGBOX_TEST_STEP_OUTCOME=failure; fi
    - check_status=0
    - >
      docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp
      --volume "$CI_PROJECT_DIR:/repo:ro" --volume "$CI_PROJECT_DIR/wingbox-out:/ci/wingbox-out"
      --env WINGBOX_ROOT=/tmp/work --env CI_PROJECT_DIR=/ci
      --env WINGBOX_VERSION --env WINGBOX_ACTION_REF --env WINGBOX_HOPS --env WINGBOX_FAIL_ON --env WINGBOX_POLICY_CHANGE
      --env WINGBOX_PATHS --env WINGBOX_BASE --env WINGBOX_HEAD --env WINGBOX_COMMENT --env WINGBOX_GITLAB_TOKEN
      --env WINGBOX_TEST_RESULTS --env WINGBOX_REQUIRE_TESTS --env WINGBOX_REQUIRED_TESTS --env WINGBOX_TEST_RESULTS_ROOT=/repo
      --env WINGBOX_TEST_COMMAND --env WINGBOX_REQUIRE_TEST_PROVENANCE --env WINGBOX_TEST_STEP_OUTCOME
      --env WINGBOX_PACKAGE --env WINGBOX_LEDGER
      --env CI_PIPELINE_SOURCE --env CI_COMMIT_SHA --env CI_COMMIT_BEFORE_SHA
      --env CI_MERGE_REQUEST_DIFF_BASE_SHA --env CI_MERGE_REQUEST_IID --env CI_PROJECT_ID --env CI_API_V4_URL
      --env CI_PROJECT_PATH --env CI_JOB_ID --env CI_JOB_URL --env CI_JOB_NAME --env CI_CONFIG_PATH
      --env CI_PIPELINE_ID --env CI_PIPELINE_CREATED_AT --env CI_JOB_STARTED_AT
      "$WINGBOX_IMAGE" sh -ec '
      git -c init.defaultBranch=main clone --quiet https://github.com/aileron-tech/wingbox-action.git /tmp/action;
      git -C /tmp/action checkout --quiet "$WINGBOX_ACTION_REF";
      status=0;
      { python -P -m venv /tmp/venv
      && /tmp/venv/bin/python -P -m pip install --disable-pip-version-check --quiet "wingbox[all]==$WINGBOX_VERSION"
      && git -c init.defaultBranch=main clone --quiet --no-checkout /repo /tmp/work
      && git -C /tmp/work checkout --quiet --detach "$CI_COMMIT_SHA"
      && cd /tmp/work
      && /tmp/venv/bin/python /tmp/action/wingbox_gitlab.py; } || status=$?;
      if [ "$status" -ne 0 ] && [ ! -s /ci/wingbox-out/wingbox-evidence.json ]; then python -P /tmp/action/wingbox_gitlab.py --did-not-run || true; fi;
      exit "$status"'
      || check_status=$?
    # A record also when the container left none (it could not start, or the scripts could not be fetched):
    # the smallest record, written here.
    - >
      if [ "$check_status" -ne 0 ] && [ ! -s wingbox-out/wingbox-evidence.json ]; then
      printf '%s\n' '{"result": {"boundaries": "UNKNOWN", "execution": "error", "reasons": ["check-did-not-run"]}}' > wingbox-out/wingbox-evidence.json;
      fi
    - if [ "$tests_status" -ne 0 ]; then exit "$tests_status"; fi
    - exit "$check_status"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - wingbox-out/
    reports:
      dotenv: wingbox-out/wingbox.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
