# Wingbox pull request check for GitLab CI.
#
# Add to .gitlab-ci.yml:
#
#   include:
#     - remote: "https://raw.githubusercontent.com/aileron-tech/wingbox-action/v1/gitlab/wingbox.gitlab-ci.yml"
#
# For runners with the Docker or Kubernetes executor. For runners with the shell executor include
# gitlab/wingbox-shell.gitlab-ci.yml instead (it runs the same check in a container).
#
# The job checks every merge request and every push to the default branch. The report is in the job
# log and in the artifact folder wingbox-out/. To get it as one note on the merge request, add a
# masked CI/CD variable WINGBOX_GITLAB_TOKEN with a project access token (scope: api).
# Everything runs on your runner, without a language model; no code leaves it.

wingbox:
  stage: test
  image: python:3.12
  variables:
    GIT_DEPTH: "0"                    # the whole history: the base commit is checked out next to the head
    WINGBOX_VERSION: "0.14.0"         # the wingbox release from PyPI
    WINGBOX_ACTION_REF: "v1"          # the tag, branch or commit of aileron-tech/wingbox-action the scripts come from
    WINGBOX_HOPS: "2"
    WINGBOX_FAIL_ON: "none"           # none, violations, not-checked, strict or existing
    WINGBOX_TEST_SCRIPT: ""           # the command that runs your tests in this job and writes JUnit XML (see the README)
    WINGBOX_POLICY_CHANGE: ""         # fail or report: a change of the baseline, the rules or this pipeline file; empty: fail with strict
  script:
    # The tests first, with their status kept: the check runs whatever they say, learns how they ended,
    # and the job ends with the tests' status.
    - tests_status=0
    - if [ -n "$WINGBOX_TEST_SCRIPT" ]; then sh -c "$WINGBOX_TEST_SCRIPT" || tests_status=$?; fi
    - if [ -n "$WINGBOX_TEST_SCRIPT" ]; then export WINGBOX_TEST_COMMAND="$WINGBOX_TEST_SCRIPT" WINGBOX_TEST_STEP_OUTCOME=success; fi
    - if [ "$tests_status" -ne 0 ]; then export WINGBOX_TEST_STEP_OUTCOME=failure; fi
    - WINGBOX_TOOLS="$(mktemp -d)"
    - check_status=0
    - >
      pip install --disable-pip-version-check --quiet "wingbox[all]==$WINGBOX_VERSION"
      && git clone --quiet https://github.com/aileron-tech/wingbox-action.git "$WINGBOX_TOOLS/action"
      && git -C "$WINGBOX_TOOLS/action" checkout --quiet "$WINGBOX_ACTION_REF"
      && python "$WINGBOX_TOOLS/action/wingbox_gitlab.py"
      || check_status=$?
    # A record also when the check did not run (the install or the download failed): by the script, and
    # when that cannot run either, the smallest record, written here.
    - >
      if [ "$check_status" -ne 0 ] && [ ! -s wingbox-out/wingbox-evidence.json ]; then
      python -P "$WINGBOX_TOOLS/action/wingbox_gitlab.py" --did-not-run
      || { mkdir -p wingbox-out;
      printf '%s\n' '{"result": {"boundaries": "UNKNOWN", "execution": "error", "reasons": ["check-did-not-run"]}}' > wingbox-out/wingbox-evidence.json; };
      fi
    - if [ "$tests_status" -ne 0 ]; then exit "$tests_status"; fi
    - exit "$check_status"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - wingbox-out/
    reports:
      dotenv: wingbox-out/wingbox.env
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
