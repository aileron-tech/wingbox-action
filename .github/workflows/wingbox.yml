# The check on this repository's own pull requests: the released action (v1) comments with who uses what
# a pull request changes. Nothing of the pull request is run.
name: wingbox

on: pull_request

permissions:
  contents: read
  pull-requests: write   # the comment

concurrency:
  group: wingbox-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: aileron-tech/wingbox-action@v1
